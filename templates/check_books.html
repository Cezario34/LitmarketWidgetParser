<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подсчёт символов</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Подсчёт символов</h1>
        <p class="subtitle">Введите текст — счётчик обновляется автоматически</p>

        <textarea id="textInput" placeholder="Начните печатать..."></textarea>

        <div class="counter">
            <span class="counter-label">Символов (включая пробелы):</span>
            <span class="counter-value" id="charCount">0</span>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('textInput');
        const counter = document.getElementById('charCount');

        textarea.addEventListener('input', () => {
            counter.textContent = textarea.value.length;
        });
    </script>
</body>
</html>
